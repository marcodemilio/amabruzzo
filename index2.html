<style>
:root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #d0d7de;
    --text: #111827;
    --muted: #6b7280;
    
    --fineco-blue: #00539F;
    --fineco-blue-hover: #003d78;
    --fineco-blue-light: #e6f0fa;
    
    --btn-bg: #f8fafc;
    --btn-hover: #f1f5f9;
    --btn-active-bg: #00539F;
    --btn-active-text: #ffffff;
    
    --danger: #b91c1c;
    --success: #2e7d32;
    --radius: 0.5rem;
    --font: 'Figtree', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

#map { width: 100vw; height: 100vh; z-index: 1; }

.leaflet-top.leaflet-right, .leaflet-control-zoom { display: none !important; }

/* PULSANTE MENU HAMBURGER (IN ALTO A SINISTRA) */
.toggle-sidebar-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1001;
    width: 44px;
    height: 44px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border: 1.5px solid var(--fineco-blue);
    border-radius: var(--radius);
    color: var(--fineco-blue);
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    transition: all 0.2s ease;
}
.toggle-sidebar-btn:hover {
    background: var(--fineco-blue);
    color: #ffffff;
}

/* BARRA LATERALE A SCOMPARSA (LATO SINISTRO) */
.sidebar-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    max-width: 85vw;
    height: 100%;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(12px);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 20px rgba(0,0,0,0.2);
    z-index: 1003;
    display: flex;
    flex-direction: column;
    padding: 18px 16px;
    gap: 14px;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
}
.sidebar-panel.open {
    transform: translateX(0);
}

/* HEADER SIDEBAR: LOGO INGRANDITO E CENTRATO */
.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 2px;
}
.sidebar-logo-img {
    max-height: 52px;
    width: auto;
    display: block;
    object-fit: contain;
}
.close-sidebar-btn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1.4rem;
    color: var(--muted);
    cursor: pointer;
    padding: 0 4px;
}
.close-sidebar-btn:hover { color: var(--text); }

.sidebar-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.sidebar-section-label {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;

}

/* BOTTONI AZIONE SOBRI */
.btn-action-side {

}

/* BARRA MODALITÀ CON ICONE PULITE */

/* POPUP LARGHEZZA ESTESA */

.popup-table-wrap, .forecast-scroll-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: var(--radius); background: #ffffff; margin-bottom: .5rem; }

.popup-weather-table { width:100%; border-collapse:collapse; font-size:0.74rem; white-space: nowrap; }
.popup-weather-table th { background:#f8fafc; color:var(--text); font-size:0.72rem; font-weight:700; padding:5px 7px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:2; text-align:center; }

</style>

<script>
(() => {
const WEATHER_CSV = './dati_meteo_30g.csv';
const STATIONS_CSV = './dati_stazioni_30g.csv';

const map = L.map('map', {
    zoomControl: false,
    zoomDelta: 0.25,
    zoomSnap: 0.25
}).setView([42.35, 13.95], 9.50);

document.getElementById('btnZoomIn').addEventListener('click', () => map.zoomIn());
document.getElementById('btnZoomOut').addEventListener('click', () => map.zoomOut());

const sidebarPanel = document.getElementById('sidebarPanel');
const btnToggleSidebar = document.getElementById('btnToggleSidebar');
const btnCloseSidebar = document.getElementById('btnCloseSidebar');

function openSidebar() {
    sidebarPanel.classList.add('open');
}
function closeSidebar() {
    sidebarPanel.classList.remove('open');
}

btnToggleSidebar.addEventListener('click', openSidebar);
btnCloseSidebar.addEventListener('click', closeSidebar);

function resetView() {
    map.setView([42.35, 13.95], 9.50);
    map.closePopup();
    const select = document.getElementById('stationSelect');
    if(select) select.value = '';
    refreshMarkers(stationData);
    closeSidebar();
}

document.getElementById('btnResetView').addEventListener('click', resetView);

const osmAdmin = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
osmAdmin.addTo(map);

const zoomDisplay = document.getElementById('zoomDisplay');
function updateZoomDisplay() {
    if(zoomDisplay) zoomDisplay.textContent = 'Zoom: ' + map.getZoom().toFixed(2);
}
map.on('zoomend moveend', updateZoomDisplay);
updateZoomDisplay();

let stationData = [];
let markerRefs = new Map();
let markersLayer = L.layerGroup().addTo(map);
let globalMaxUpdateText = 'n/d';

let currentMode = 'rain'; 
const forecastCache = new Map();

const num = value => {
    const result = parseFloat(String(value ?? '').replace(',','.').trim());
    return Number.isFinite(result) ? result : null;
};

const get = (row, ...keys) => {
    if (!row) return '';
    const rowKeys = Object.keys(row);
    for (const key of keys) {
        const cleanKey = key.toLowerCase().replace(/[\s_]/g, '');
        const found = rowKeys.find(k => k.toLowerCase().replace(/[\s_]/g, '') === cleanKey);
        if (found && row[found] !== undefined && row[found] !== null && String(row[found]).trim() !== '') {
            return String(row[found]).trim();
        }
    }
    return '';
};

function parseDate(value) {
    if (value === null || value === undefined) return null;
    const text = String(value).trim();
    if (!text) return null;

    let match = text.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (match) {
        const day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
        const date = new Date(year, month - 1, day, Number(match[4] || 0), Number(match[5] || 0));
        if (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day) return date;
        return null;
    }
    return null;
}

function pad(v) { return String(v).padStart(2,'0'); }
function formatDate(d) { return d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : 'n/d'; }
function dayKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayLabel(d) { return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; }

const fetchText = async path => {
    const response = await fetch(`${path}?v=${Date.now()}`, { cache:'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status} per ${path}`);
    return response.text();
};

const delimiter = text => {
    return [';',',','\t','|'].map(character => ({
        character,
        count:(text.split(/\r?\n/).slice(0,10).join('\n').match(new RegExp('\\' + character, 'g')) || []).length
    })).sort((a,b) => b.count - a.count)[0].character;
};

function parseWeather(rows) {
    return rows.map(row => ({
        detectedAt: parseDate(get(row, 'DataRilevamento')),
        updatedAt: parseDate(get(row, 'DataAggiornamento')),
        tmin: num(get(row, 'TemperaturaMin')),
        tmax: num(get(row, 'TemperaturaMax')),
        tavg: num(get(row, 'TempMedia')),
        rain: num(get(row, 'PioggiaGiornaliera')),
        rainMaxHour: num(get(row, 'PioggiaMaxOraria')),
        uMin: num(get(row, 'UmiditaMin')),
        uMax: num(get(row, 'UmiditaMax')),
        ventoMax: num(get(row, 'VentoMax')),
        ventoMedio: num(get(row, 'VentoMedio')),
        dirVento: num(get(row, 'DirezioneVento')),
        stato: get(row, 'Stato').toLowerCase()
    }))
    .filter(row => row.detectedAt)
    .sort((a,b) => a.detectedAt - b.detectedAt);
}

function summarizeWeather(rows) {
    const series = parseWeather(rows);
    const latest = series.at(-1) || null;
    const online = latest?.stato === 'online' || latest?.stato === '1' || latest?.stato === 'true' || latest?.stato === 'ok';
    return {
        count: series.length,
        latest,
        series,
        online,
        rainValue: latest ? latest.rain : null,
        updateText: latest?.updatedAt ? formatDate(latest.updatedAt) : 'n/d'
    };
}

function popupHtml(station) {
    const summary = station.summary;
    const status = summary.online ? 'ONLINE' : 'OFFLINE';

    const daily = new Map();
    summary.series.forEach(row => {
        if (!row.detectedAt) return;
        const key = dayKey(row.detectedAt);
        const previous = daily.get(key) || { 
            rain: 0, tmin: null, tmax: null, tavg: null,
            rainMaxHour: 0, uMin: null, uMax: null,
            ventoMax: 0, ventoMedio: 0, dirVento: 0
        };

        if (Number.isFinite(row.rain)) previous.rain += row.rain;
        if (Number.isFinite(row.rainMaxHour)) previous.rainMaxHour = Math.max(previous.rainMaxHour, row.rainMaxHour);
        if (Number.isFinite(row.tmin)) previous.tmin = previous.tmin === null ? row.tmin : Math.min(previous.tmin, row.tmin);
        if (Number.isFinite(row.tmax)) previous.tmax = previous.tmax === null ? row.tmax : Math.max(previous.tmax, row.tmax);
        if (Number.isFinite(row.tavg)) previous.tavg = row.tavg;
        if (Number.isFinite(row.uMin)) previous.uMin = previous.uMin === null ? row.uMin : Math.min(previous.uMin, row.uMin);
        if (Number.isFinite(row.uMax)) previous.uMax = previous.uMax === null ? row.uMax : Math.max(previous.uMax, row.uMax);
        if (Number.isFinite(row.ventoMax)) previous.ventoMax = Math.max(previous.ventoMax, row.ventoMax);
        if (Number.isFinite(row.ventoMedio)) previous.ventoMedio = row.ventoMedio;
        if (Number.isFinite(row.dirVento)) previous.dirVento = row.dirVento;

        daily.set(key, previous);
    });

    const today = new Date();
    today.setHours(0,0,0,0);
    let cumulative = 0;
    const tableRows = [];

    for (let i = 0; i <= 30; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const item = daily.get(dayKey(date));

        const rain = item && Number.isFinite(item.rain) ? item.rain : 0;
        cumulative += rain;
        const rainMaxHour = item && Number.isFinite(item.rainMaxHour) ? item.rainMaxHour.toFixed(1) : '0.0';

        const tMin = item && Number.isFinite(item.tmin) ? Math.round(item.tmin) : 0;
        const tMax = item && Number.isFinite(item.tmax) ? Math.round(item.tmax) : 0;
        const tAvg = item && Number.isFinite(item.tavg) ? Math.round(item.tavg) : (tMin && tMax ? Math.round((tMin + tMax)/2) : 0);
        const tempStr = `${tMin}° / ${tMax}° (${tAvg}°)`;

        const uMin = item && Number.isFinite(item.uMin) ? Math.round(item.uMin) : 0;
        const uMax = item && Number.isFinite(item.uMax) ? Math.round(item.uMax) : 0;
        const humStr = `${uMin}% - ${uMax}%`;

        const vMax = item && Number.isFinite(item.ventoMax) ? Math.round(item.ventoMax) : 0;
        const vMed = item && Number.isFinite(item.ventoMedio) ? Math.round(item.ventoMedio) : 0;
        const vDir = item && Number.isFinite(item.dirVento) ? Math.round(item.dirVento) : 0;
        const windStr = `${vMax} / ${vMed} (${vDir}°)`;

        const dayText = i === 0 ? 'Oggi' : `-${i} (${dayLabel(date)})`;

        tableRows.push(`
            <tr class="${i === 0 ? 'today-row' : ''}">
                <td style="text-align:left;">${dayText}</td>
                <td>${rain.toFixed(1)}</td>
                <td>${cumulative.toFixed(1)}</td>
                <td>${rainMaxHour}</td>
                <td>${tempStr}</td>
                <td>${humStr}</td>
                <td>${windStr}</td>
            </tr>
        `);
    }

    return `
        <div class="popup-container">
            <div class="popup-header-row">
                <span class="popup-station-name">${station.name} (${station.id})</span>
                <span style="font-size:0.72rem; color:var(--muted);">Stato: <strong style="color:${summary.online?'#2e7d32':'#b91c1c'};">${status}</strong> &bull; Agg: ${summary.updateText}</span>
            </div>

            <div id="forecast-container-${station.id}" style="margin-bottom:.4rem;">
                <div style="padding:6px;text-align:center;color:var(--muted);font-weight:600;font-size:0.75rem;">Caricamento previsioni 5 giorni...</div>
            </div>

            <div class="popup-table-wrap">
                <table class="popup-weather-table">
                    <thead>
                        <tr>
                            <th style="text-align:left;">Giorno</th>
                            <th>Pioggia</th>
                            <th>Cumulata</th>
                            <th>Max/h</th>
                            <th>Temperatura</th>
                            <th>Umidità</th>
                            <th>Vento Max/Med (Dir.)</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows.join('')}</tbody>
                </table>
            </div>
        </div>
    `;
}

async function loadOpenMeteoForecast(stationId, lat, lon) {
    const container = document.getElementById(`forecast-container-${stationId}`);
    if (!container) return;
    if (forecastCache.has(stationId)) {
        renderForecastHtml(container, forecastCache.get(stationId));
        return;
    }
    try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=auto`);
        const data = await res.json();
        if (!data.daily) { container.innerHTML = ''; return; }
        forecastCache.set(stationId, data.daily);
        renderForecastHtml(container, data.daily);
    } catch (err) {
        container.innerHTML = '<div style="padding:4px;text-align:center;color:var(--danger);font-size:0.72rem;">Previsioni non disponibili</div>';
    }
}

function renderForecastHtml(container, daily) {
    let thCols = '', rainRow = '', tMinRow = '', tMaxRow = '';
    for (let i = 0; i < 5; i++) {
        if (!daily.time[i]) break;
        const dParts = daily.time[i].split('-');
        thCols += `<th style="padding:3px 4px;">${dParts[2]}/${dParts[1]}</th>`;
        rainRow += `<td style="padding:3px 4px;">${(daily.precipitation_sum[i] ?? 0).toFixed(1)}</td>`;
        tMinRow += `<td style="padding:3px 4px;">${(daily.temperature_2m_min[i] ?? 0).toFixed(0)}°</td>`;
        tMaxRow += `<td style="padding:3px 4px;">${(daily.temperature_2m_max[i] ?? 0).toFixed(0)}°</td>`;
    }
    container.innerHTML = `
        <div style="font-weight:800;margin-bottom:2px;color:var(--fineco-blue);font-size:.75rem;text-transform:uppercase;">Previsioni prossimi 5 giorni</div>
        <div class="forecast-scroll-wrap">
            <table class="popup-weather-table">
                <thead><tr style="background:#f8fafc;"><th style="text-align:left;padding:3px 4px;">Parametro</th>${thCols}</tr></thead>
                <tbody>
                    <tr><td style="text-align:left;padding:3px 4px;font-weight:600;">Pioggia mm</td>${rainRow}</tr>
                    <tr><td style="text-align:left;padding:3px 4px;font-weight:600;">Temp Min</td>${tMinRow}</tr>
                    <tr><td style="text-align:left;padding:3px 4px;font-weight:600;">Temp Max</td>${tMaxRow}</tr>
                </tbody>
            </table>
        </div>
    `;
}

function markerIcon(station) {
    const statusClass = station.summary.online ? 'online' : 'offline';
    let val = station.summary.rainValue;
    if (currentMode === 'min') val = station.summary.latest?.tmin;
    if (currentMode === 'max') val = station.summary.latest?.tmax;

    return L.divIcon({
        className: '',
        html: `<div class="station-marker ${currentMode} ${statusClass}">${Number.isFinite(val) ? Math.round(val) : '0'}</div>`,
        iconSize: [26,26],
        iconAnchor: [13,13],
        popupAnchor: [0,-15]
    });
}

function refreshMarkers(data) {
    markersLayer.clearLayers();
    markerRefs.clear();

    data.forEach(station => {
        const marker = L.marker([station.lat, station.lon], { icon: markerIcon(station) })
        .addTo(markersLayer)
        .bindPopup(popupHtml(station), { maxWidth: 750, autoPan: true });

        marker.on('popupopen', () => loadOpenMeteoForecast(station.id, station.lat, station.lon));
        
        marker.on('popupclose', () => {
            map.setView([42.35, 13.95], 9.50);
        });

        markerRefs.set(station.id, marker);
    });
}

function populateDropdown(data) {
    const select = document.getElementById('stationSelect');
    if (!select) return;
    select.innerHTML = '<option value="">🔍 Seleziona Stazione...</option>';
    [...data].sort((a,b) => a.name.localeCompare(b.name, 'it')).forEach(station => {
        const opt = document.createElement('option');
        opt.value = station.id;
        opt.textContent = `${station.name} (${station.id})`;
        select.appendChild(opt);
    });

    select.onchange = (e) => {
        const stationId = e.target.value;
        if (!stationId) {
            resetView();
            return;
        }
        const station = data.find(s => s.id === stationId);
        if (station) {
            map.flyTo([station.lat, station.lon], 12);
            const marker = markerRefs.get(station.id);
            if (marker) marker.openPopup();
            closeSidebar();
        }
    };
}

function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnRainMode').classList.toggle('active', mode === 'rain');
    document.getElementById('btnMaxMode').classList.toggle('active', mode === 'max');
    document.getElementById('btnMinMode').classList.toggle('active', mode === 'min');
    refreshMarkers(stationData);
}

document.getElementById('btnRainMode').addEventListener('click', () => setMode('rain'));
document.getElementById('btnMaxMode').addEventListener('click', () => setMode('max'));
document.getElementById('btnMinMode').addEventListener('click', () => setMode('min'));

async function init() {
    try {
        const [weatherText, stationsText] = await Promise.all([
            fetchText(WEATHER_CSV),
            fetchText(STATIONS_CSV)
        ]);

        const weatherParsed = Papa.parse(weatherText, {
            header: true, skipEmptyLines: true, delimiter: delimiter(weatherText), transformHeader: h => h.trim().replace(/^\ufeff/, ''), transform: v => String(v).trim()
        });

        const stationsParsed = Papa.parse(stationsText, {
            header: true, skipEmptyLines: true, delimiter: delimiter(stationsText), transformHeader: h => h.trim().replace(/^\ufeff/, ''), transform: v => String(v).trim()
        });

        const coordsById = new Map();
        (stationsParsed.data || []).forEach(row => {
            const rowKeys = Object.keys(row);
            const findKey = (...possible) => {
                for (const p of possible) {
                    const cleanP = p.toLowerCase();
                    const found = rowKeys.find(k => k.toLowerCase().replace(/[\s_]/g, '') === cleanP);
                    if (found) return row[found];
                }
                return '';
            };

            const id = String(findKey('Id', 'ID') || '').trim();
            const lat = num(findKey('Lat', 'Latitudine'));
            const lon = num(findKey('Long', 'Lon', 'Longitude'));

            if (id && Number.isFinite(lat) && Number.isFinite(lon)) {
                coordsById.set(id, { lat, lon });
                coordsById.set(id.toLowerCase(), { lat, lon });
            }
        });

        const weatherRows = weatherParsed.data || [];
        const weatherById = new Map();
        const stationsMap = new Map();

        let maxUpdateDate = null;

        weatherRows.forEach(row => {
            const id = String(get(row, 'Id', 'ID') || '').trim();
            if (!id) return;
            if (!weatherById.has(id)) weatherById.set(id, []);
            weatherById.get(id).push(row);

            const dtUpdate = parseDate(get(row, 'DataAggiornamento'));
            if (dtUpdate && (!maxUpdateDate || dtUpdate > maxUpdateDate)) {
                maxUpdateDate = dtUpdate;
            }

            if (!stationsMap.has(id)) {
                const coords = coordsById.get(id) || coordsById.get(id.toLowerCase());
                if (coords) {
                    stationsMap.set(id, {
                        id,
                        name: get(row, 'StazioneMeteo', 'Stazione', 'Nome', 'Name') || `Stazione ${id}`,
                        lat: coords.lat,
                        lon: coords.lon
                    });
                }
            }
        });

        if (maxUpdateDate) {
            globalMaxUpdateText = formatDate(maxUpdateDate);
        }

        stationData = Array.from(stationsMap.values()).map(station => ({
            ...station,
            summary: summarizeWeather(weatherById.get(station.id) || [])
        })).filter(station => station.id && station.name && Number.isFinite(station.lat) && Number.isFinite(station.lon));

        const totalStations = stationData.length;
        const offlineStations = stationData.filter(s => !s.summary.online).length;

        document.getElementById('summaryStats').innerHTML = `Stazioni Monitorate: <strong>${totalStations}</strong> di cui <strong>${offlineStations}</strong> offline`;
        document.getElementById('updateDateText').textContent = `Dati Aggiornati al: ${globalMaxUpdateText}`;

        refreshMarkers(stationData);
        populateDropdown(stationData);

        setTimeout(() => map.invalidateSize(), 200);
    } catch (error) {
        console.error("Errore di caricamento:", error);
    }
}

init();
})();
</script>
