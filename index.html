name="viewport"
content="width=device-width, initial-scale=1.0">

Alcolisti Micologici Analcolici TRIS - Rel. 01-B-032
</title>

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link

rel="stylesheet">

crossorigin>

<style>
:root{
--bg:#f7f6f2;
--surface:#ffffff;
--border:#d4d1ca;
--text:#28251d;
--muted:#6f6d68;
--primary:#01696f;
--success:#437a22;
--danger:#a13544;
--blue-dark:#003f88;
--blue:#1f78b4;
--red:#a13544;
--gray:#9a9a9a;
--fuchsia:#ff00ff;
--green-dark:#0b5d1e;
--tris:#7b2cbf;
--active-green:#a8df6f;
--radius:1rem;
--font:'Inter',system-ui,sans-serif;
--sidebar-width:360px;
--sidebar-collapsed-width:34px;
}

*{
box-sizing:border-box
}

html,
body{
margin:0;
min-height:100%;
background:var(--bg);
color:var(--text);
font-family:var(--font)
}

.app{
display:grid;
grid-template-columns:var(--sidebar-width) 1fr;
min-height:100vh;
transition:grid-template-columns .25s ease
}

.app.sidebar-collapsed{
grid-template-columns:var(--sidebar-collapsed-width) 1fr
}

.sidebar{
position:relative;
width:var(--sidebar-width);
display:flex;
flex-direction:column;
gap:1rem;
padding:1rem;
overflow:auto;
background:var(--surface);
border-right:1px solid var(--border);
transition:padding .25s ease
}

.app.sidebar-collapsed .sidebar{
padding:.35rem .25rem;
overflow:hidden
}

.sidebar-toggle-inside{
position:absolute;
top:.5rem;
right:.5rem;
z-index:20
}

.sidebar-toggle-mini{
display:none;
position:absolute;
top:8px;
left:6px;
z-index:1200;
width:22px;
height:22px;
border:0;
border-radius:999px;
background:#e9c96b;
color:#2c2410;
font-weight:900;
cursor:pointer
}

.app.sidebar-collapsed .sidebar-toggle-mini{
display:block
}

.brand{
display:flex;
justify-content:center;
align-items:flex-start;
margin-top:1.2rem;
text-align:center
}

.logo-wrap{
display:flex;
align-items:center;
justify-content:center;
gap:.65rem;
width:100%
}

.logo{
width:40px;
height:40px;
color:var(--primary)
}

h1{
margin:0;
overflow:hidden;
font-size:clamp(.98rem,1.35vw,1.25rem);
line-height:1.05;
text-align:center;
text-overflow:ellipsis;
white-space:nowrap
}

.tris-word{
color:var(--tris);
font-weight:800
}

.release{
display:block;
margin-top:.15rem;
color:var(--muted);
font-size:.72rem;
text-align:center
}

.subtitle-small{
margin:.35rem 0 0;
color:var(--muted);
font-size:.78rem;
line-height:1.25;
text-align:center
}

.subtitle-small strong{
color:#b00020;
font-weight:800
}

.panel{
padding:1rem;
border:1px solid var(--border);
border-radius:var(--radius);
background:var(--surface);
box-shadow:0 1px 2px rgba(0,0,0,.08)
}

.panel h2{
margin:0 0 .6rem;
font-size:1.05rem
}

.quad-panel{
background:#dfeeff
}

.station-panel{
background:#f7f3ff
}

.field label{
display:block;
margin-bottom:.3rem;
font-size:.92rem;
font-weight:600
}

.field select{
width:100%;
min-height:42px;
padding:0 .75rem;
border:1px solid var(--border);
border-radius:.5rem;
background:var(--surface);
color:var(--text);
font-family:var(--font);
cursor:pointer
}

.list{
display:grid;
gap:.7rem;
max-height:32vh;
padding-right:.25rem;
overflow:auto
}

.station-card{
padding:.85rem;
border:1px solid var(--border);
border-radius:.75rem;
background:var(--bg);
color:inherit;
cursor:pointer;
text-align:left
}

.station-title{
margin-bottom:.2rem;
font-weight:700
}

.station-meta{
display:flex;
flex-wrap:wrap;
gap:.45rem;
color:var(--muted);
font-size:.9rem
}

.map-wrap{
position:relative
}

.map-wrap,
#map{
width:100%;
height:100vh
}

.toolbar-btn{
min-height:34px;
padding:0 .7rem;
border:1px solid var(--border);
border-radius:.5rem;
background:#ffffff;
color:var(--text);
cursor:pointer
}

.quad-grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:.22rem;
margin-top:.65rem
}

.quad-grid .toolbar-btn{
min-height:30px;
padding:0 .35rem;
border-color:#17354b;
background:#234c6a;
color:#fff;
font-size:.72rem
}

.quad-grid .toolbar-btn:hover{
background:#18364c
}

.icon-row{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:.45rem;
margin-top:.5rem
}

.icon-pill{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:68px;
min-height:38px;
padding:0 .8rem;
border:1px solid var(--border);
border-radius:999px;
background:var(--bg);
color:var(--text);
cursor:pointer;
user-select:none
}

.icon-pill.active{
border-color:#87bf47;
background:var(--active-green);
color:#20310f
}

.weather-icon{
font-size:1.45rem;
line-height:1
}

.blue-dark{
color:var(--blue-dark)
}

.red{
color:var(--red)
}

.weather-mode-label{
display:block;
width:max-content;
max-width:100%;
margin:.8rem auto 0;
padding:.55rem 1rem;
border:2px solid #437a22;
border-radius:.75rem;
background:#cceeb5;
color:#0b5d1e;
font-size:.88rem;
font-weight:800;
line-height:1.2;
text-align:center
}

.weather-mode-label.min{
border-color:#003f88;
background:#cfe3ff;
color:#003f88
}

.weather-mode-label.max{
border-color:#a13544;
background:#ffd2d8;
color:#a13544
}

.report-link{
display:flex;
align-items:center;
justify-content:center;
gap:.45rem;
width:100%;
min-height:38px;
margin-top:.8rem;
padding:0 .8rem;
border:1px solid var(--border);
border-radius:999px;
background:var(--bg);
color:var(--text);
font-size:.9rem;
font-weight:700;
text-decoration:none
}

.report-link:hover{
border-color:#87bf47;
background:var(--active-green);
color:#20310f
}

.summary-line{
margin-top:.7rem;
color:var(--muted);
font-size:.86rem;
line-height:1.35;
text-align:center
}

.summary-line strong{
color:var(--text)
}

.debug-box{
display:block;
max-height:240px;
padding:.75rem;
overflow:auto;
border:1px solid var(--border);
border-radius:.75rem;
background:var(--bg);
font-size:.82rem;
line-height:1.35;
white-space:pre-wrap
}

.popup-title{
margin-bottom:.35rem;
color:var(--primary);
font-size:1rem;
font-weight:800
}

.popup-meta{
color:var(--text);
font-size:.92rem;
line-height:1.4
}

.popup-status{
margin-top:.15rem;
font-weight:900;
letter-spacing:.02em
}

.popup-status.online{
color:var(--success)
}

.popup-status.offline{
color:var(--danger)
}

.popup-update-line{
margin-top:.25rem;
font-weight:600
}

.popup-table-wrap{
max-height:280px;
margin-top:.45rem;
overflow:auto
}

.popup-weather-table{
width:100%;
border-collapse:collapse;
table-layout:fixed;
font-family:inherit;
font-size:.88rem
}

.popup-weather-table col.col-day{
width:23%
}

.popup-weather-table col.col-rain{
width:15%
}

.popup-weather-table col.col-cumulative{
width:19%
}

.popup-weather-table col.col-temperature{
width:43%
}

.popup-weather-table td{
padding:.13rem .25rem;
vertical-align:middle;
line-height:1.35;
white-space:nowrap
}

.popup-weather-table td:nth-child(1){
text-align:left
}

.popup-weather-table td:nth-child(2),
.popup-weather-table td:nth-child(3){
text-align:right
}

.popup-weather-table td:nth-child(4){
text-align:right
}

.popup-weather-table tr.today-row{
font-weight:800;
background:#f0ffe5
}

.popup-rain-day{
color:var(--green-dark);
font-weight:700
}

.popup-rain-cum{
color:var(--fuchsia);
font-weight:700
}

.popup-temp-min{
color:var(--blue-dark);
font-weight:800
}

.popup-temp-max{
color:var(--red);
font-weight:800
}

.popup-temp-muted{
color:var(--muted)
}

.station-marker{
position:relative;
display:grid;
place-items:center;
min-width:34px;
height:34px;
padding:0 .25rem;
transform:translate(-50%,-50%);
border:3px solid #fff;
border-radius:999px;
box-shadow:0 3px 10px rgba(0,0,0,.25);
color:#fff;
font-size:12px;
font-weight:800;
line-height:1
}

.station-marker.online{
background:var(--success)
}

.station-marker.offline{
background:var(--danger)
}

.station-marker.min.online{
background:var(--blue-dark)
}

.station-marker.min.offline{
background:var(--red)
}

.station-marker.max.online{
background:var(--red)
}

.station-marker.max.offline{
background:var(--gray)
}

.station-marker::after{
position:absolute;
bottom:-7px;
left:50%;
width:0;
height:0;
transform:translateX(-50%);
border-top:8px solid currentColor;
border-right:6px solid transparent;
border-left:6px solid transparent;
content:''
}

.station-marker.online::after{
color:var(--success)
}

.station-marker.offline::after{
color:var(--danger)
}

@media (max-width:980px){
.app{
grid-template-columns:1fr
}

.sidebar{
width:auto;
border-right:0;
border-bottom:1px solid var(--border)
}

.app.sidebar-collapsed{
grid-template-columns:var(--sidebar-collapsed-width) 1fr
}

.map-wrap,
#map{
height:70vh
}

h1{
font-size:clamp(.98rem,4vw,1.2rem)
}

.popup-weather-table{
font-size:.78rem
}
}
</style>
</head>

<script>
(() => {
const STATIONS_CSV =
'./stazioni_meteo.csv';

const WEATHER_CSV =
'./dati_meteo_30g.csv';

const APP =
document.getElementById('app');

const map =
L.map('map').setView(
[42.35,13.95],
9
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:18,
attribution:'&copy; OpenStreetMap'
}
).addTo(map);

const zoneBounds = [

L.latLngBounds(
[[42.20,13.00],[42.95,13.60]]
),

L.latLngBounds(
[[42.20,13.60],[42.95,14.20]]
),

L.latLngBounds(
[[42.20,14.20],[42.95,14.95]]
),

L.latLngBounds(
[[41.65,13.00],[42.20,13.60]]
),

L.latLngBounds(
[[41.65,13.60],[42.20,14.20]]
),

L.latLngBounds(
[[41.65,14.20],[42.20,14.95]]
)
];

const totalBounds =
L.latLngBounds(
[[41.55,12.75],[43.05,15.10]]
);

map.setMaxBounds(
L.latLngBounds(
[[41.45,12.55],[43.15,15.25]]
)
);

map.fitBounds(
totalBounds,
{
padding:[20,20],
maxZoom:11
}
);

const els = {
stationSelect:
document.getElementById('stationSelect'),

stationList:
document.getElementById('stationList'),

summaryLine:
document.getElementById('summaryLine'),

debugBox:
document.getElementById('debugBox'),

resetViewBtn:
document.getElementById('resetViewBtn'),

quadGrid:
document.getElementById('quadGrid'),

lastUpdate:
document.getElementById('lastUpdate'),

weatherModeLabel:
document.getElementById('weatherModeLabel'),

labelRainBtn:
document.getElementById('labelRainBtn'),

labelMinBtn:
document.getElementById('labelMinBtn'),

labelMaxBtn:
document.getElementById('labelMaxBtn'),

sidebarToggleInside:
document.getElementById('sidebarToggleInside'),

sidebarToggleMini:
document.getElementById('sidebarToggleMini')
};

let stationData = [];
let markerRefs = new Map();

let markersLayer =
L.layerGroup().addTo(map);

let labelMode = 'rain';

const num = value => {
const result =
parseFloat(
String(value ?? '')
.replace(',','.')
.trim()
);

return Number.isFinite(result)
? result
: null;
};

const get = (row,...keys) => {
for (const key of keys) {
const value =
row[key];

if (
value !== undefined &&
value !== null &&
String(value).trim() !== ''
) {
return String(value).trim();
}
}

return '';
};

function parseDate(value) {
if (
value === null ||
value === undefined
) {
return null;
}

const text =
String(value).trim();

if (!text) return null;

let match =
text.match(
/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
);

if (match) {
const day =
Number(match[1]);

const month =
Number(match[2]);

const year =
Number(match[3]);

const hour =
Number(match[4] || 0);

const minute =
Number(match[5] || 0);

const second =
Number(match[6] || 0);

const date =
new Date(
year,
month - 1,
day,
hour,
minute,
second
);

if (
date.getFullYear() === year &&
date.getMonth() === month - 1 &&
date.getDate() === day &&
date.getHours() === hour &&
date.getMinutes() === minute &&
date.getSeconds() === second
) {
return date;
}

return null;
}

match =
text.match(
/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
);

if (match) {
return new Date(
Number(match[1]),
Number(match[2]) - 1,
Number(match[3]),
Number(match[4] || 0),
Number(match[5] || 0),
Number(match[6] || 0)
);
}

const digits =
text.replace(/\D/g,'');

if (digits.length >= 14) {
const firstFour =
Number(digits.slice(0,4));

if (
firstFour >= 1900 &&
firstFour <= 2100
) {
return new Date(
Number(digits.slice(0,4)),
Number(digits.slice(4,6)) - 1,
Number(digits.slice(6,8)),
Number(digits.slice(8,10)),
Number(digits.slice(10,12)),
Number(digits.slice(12,14))
);
}

return new Date(
Number(digits.slice(4,8)),
Number(digits.slice(2,4)) - 1,
Number(digits.slice(0,2)),
Number(digits.slice(8,10)),
Number(digits.slice(10,12)),
Number(digits.slice(12,14))
);
}

return null;
}

function pad(value) {
return String(value).padStart(2,'0');
}

function formatDate(date) {
if (!date) return 'n/d';

return (
`${pad(date.getDate())}/` +
`${pad(date.getMonth() + 1)}/` +
`${date.getFullYear()} ` +
`${pad(date.getHours())}:` +
`${pad(date.getMinutes())}:` +
`${pad(date.getSeconds())}`
);
}

function dayKey(date) {
return (
`${date.getFullYear()}-` +
`${pad(date.getMonth() + 1)}-` +
`${pad(date.getDate())}`
);
}

function dayLabel(date) {
return (
`${pad(date.getDate())}/` +
`${pad(date.getMonth() + 1)}`
);
}

const fetchText = async path => {
const response =
await fetch(
`${path}?v=${Date.now()}`,
{
cache:'no-store'
}
);

if (!response.ok) {
throw new Error(
`HTTP ${response.status} per ${path}`
);
}

return response.text();
};

const delimiter = text => {
return [';',',','\t','|']
.map(character => ({
character,

count:(
text
.split(/\r?\n/)
.slice(0,10)
.join('\n')
.match(
new RegExp(
'\\' + character,
'g'
)
) || []
).length
}))
.sort(
(a,b) =>
b.count - a.count
)[0]
.character;
};

function parseWeather(rows) {
return rows
.map(row => ({
detectedAt:
parseDate(
get(
row,
'DataRilevamento',
'Data rilevamento',
'data_rilevamento',
'Data'
)
),

updatedAt:
parseDate(
get(
row,
'DataAggiornamento',
'Data aggiornamento',
'data_aggiornamento'
)
),

stationUpdatedAt:
parseDate(
get(
row,
'AggiornamentoStaz',
'Aggiornamento Staz.',
'AggiornamentoStazione',
'DataAggiornamentoStazione',
'data_aggiornamento_stazione'
)
),

tmax:
num(
get(
row,
'TemperaturaMax',
'TemperaturaMassima'
)
),

tmin:
num(
get(
row,
'TemperaturaMin',
'TemperaturaMinima'
)
),

rain:
num(
get(
row,
'PioggiaGiornaliera',
'Pioggia Giornaliera'
)
),

stato:
get(row,'Stato','stato')
.toLowerCase(),

fonte:
get(row,'FonteDati','fontedati')
.toLowerCase()
}))
.filter(row =>
row.detectedAt ||
row.updatedAt ||
row.stationUpdatedAt
)
.sort((a,b) => {
const dateA =
a.detectedAt ||
a.stationUpdatedAt ||
a.updatedAt ||
new Date(0);

const dateB =
b.detectedAt ||
b.stationUpdatedAt ||
b.updatedAt ||
new Date(0);

return dateA - dateB;
});
}

function summarizeWeather(rows) {
const series =
parseWeather(rows);

const latest =
series.at(-1) || null;

const online =
latest?.fonte === 'online' ||
latest?.stato === 'online' ||
latest?.stato === '1' ||
latest?.stato === 'true';

return {
count:series.length,
latest,
series,
online,
rainValue:
latest
? latest.rain
: null
};
}

/*
FUNZIONE CORRETTA

Il cumulativo viene calcolato così:

oggi = pioggia di oggi
giorno -1 = oggi + pioggia di -1
giorno -2 = giorno -1 + pioggia di -2
*/

function popupHtml(station) {
const summary =
station.summary;

const latest =
summary.latest || {};

const status =
summary.online
? 'ONLINE'
: 'OFFLINE';

const statusClass =
summary.online
? 'online'
: 'offline';

const detectedText =
formatDate(
latest.detectedAt
);

const stationUpdateText =
formatDate(
latest.stationUpdatedAt ||
latest.updatedAt
);

const daily =
new Map();

summary.series.forEach(row => {
const date =
row.detectedAt ||
row.updatedAt ||
row.stationUpdatedAt;

if (!date) return;

const key =
dayKey(date);

const previous =
daily.get(key) ||
{
rain:0,
tmin:null,
tmax:null
};

if (Number.isFinite(row.rain)) {
previous.rain += row.rain;
}

if (Number.isFinite(row.tmin)) {
previous.tmin =
previous.tmin === null
? row.tmin
: Math.min(
previous.tmin,
row.tmin
);
}

if (Number.isFinite(row.tmax)) {
previous.tmax =
previous.tmax === null
? row.tmax
: Math.max(
previous.tmax,
row.tmax
);
}

daily.set(key,previous);
});

const today =
new Date();

today.setHours(0,0,0,0);

let cumulative = 0;

const tableRows = [];

/*
Costruiamo direttamente le righe
dall'oggi verso il passato.

Poiché cumulative parte da zero:

prima iterazione:
0 + pioggia di oggi

seconda iterazione:
cumulativo di oggi + pioggia di ieri

terza iterazione:
cumulativo di ieri + pioggia di due giorni fa
*/

for (let i = 0; i <= 30; i++) {
const date =
new Date(today);

date.setDate(
date.getDate() - i
);

const item =
daily.get(dayKey(date));

const rain =
item &&
Number.isFinite(item.rain)
? item.rain
: 0;

cumulative += rain;

const temperature =
item &&
Number.isFinite(item.tmin) &&
Number.isFinite(item.tmax)
? `
<span class="popup-temp-min">
${item.tmin.toFixed(0)}°
</span>
-
<span class="popup-temp-max">
${item.tmax.toFixed(0)}°
</span>
`
: `
<span class="popup-temp-muted">
[n/d]
</span>
`;

const dayText =
i === 0
? 'Oggi'
: `-${i} ${dayLabel(date)}`;

tableRows.push(`
<tr class="${i === 0 ? 'today-row' : ''}">
<td>
${dayText}
</td>

<td>
<span class="popup-rain-day">
${rain.toFixed(1)}
</span>
</td>

<td>
<span class="popup-rain-cum">
(${cumulative.toFixed(1)})
</span>
</td>

<td>
${temperature}
</td>
</tr>
`);
}

return `
<div class="popup-title">
${station.name}
</div>

<div class="popup-meta">

<div
class="popup-status ${statusClass}">
${status}
</div>

<div class="popup-update-line">
Ril. ${detectedText}
· Aggiornamento Staz. ·
${stationUpdateText}
</div>

<div class="popup-table-wrap">

<table
class="popup-weather-table">

<colgroup>
<col class="col-day">
<col class="col-rain">
<col class="col-cumulative">
<col class="col-temperature">
</colgroup>

<tbody>
${tableRows.join('')}
</tbody>
</table>
</div>
</div>
`;
}

function markerIcon(station) {
const modeClass =
labelMode === 'min'
? 'min'
: labelMode === 'max'
? 'max'
: 'rain';

const statusClass =
station.summary.online
? 'online'
: 'offline';

let value =
station.summary.rainValue;

if (labelMode === 'min') {
value =
station.summary.latest?.tmin;
}

if (labelMode === 'max') {
value =
station.summary.latest?.tmax;
}

return L.divIcon({
className:'',
html:`
<div
class="station-marker ${modeClass} ${statusClass}">
${
Number.isFinite(value)
? Math.round(value)
: '–'
}
</div>
`,
iconSize:[34,34],
iconAnchor:[17,17],
popupAnchor:[0,-70]
});
}

function refreshMarkers(data) {
markersLayer.clearLayers();
markerRefs.clear();

data.forEach(station => {
const marker =
L.marker(
[station.lat,station.lon],
{
icon:
markerIcon(station)
}
)
.addTo(markersLayer)
.bindPopup(
popupHtml(station),
{
autoPan:true,
keepInView:true,
autoPanPaddingTopLeft:
L.point(40,100),
autoPanPaddingBottomRight:
L.point(40,40),
offset:L.point(0,70),
maxHeight:420,
maxWidth:600
}
);

markerRefs.set(
station.id,
marker
);
});
}

function renderStationSelect() {
const current =
els.stationSelect.value;

els.stationSelect.innerHTML =
'<option value="">Tutte le stazioni</option>';

const sorted =
[...stationData].sort(
(a,b) =>
a.name.localeCompare(
b.name,
'it'
)
);

sorted.forEach(station => {
const option =
document.createElement('option');

option.value =
station.id;

option.textContent =
station.name;

els.stationSelect.appendChild(option);
});

if (
current &&
stationData.some(
station =>
station.id === current
)
) {
els.stationSelect.value =
current;
}
}

function renderStationList(data) {
els.stationList.innerHTML = '';

data.forEach(station => {
const button =
document.createElement('button');

button.type = 'button';
button.className = 'station-card';

button.innerHTML = `
<div class="station-title">
${station.name}
</div>

<div class="station-meta">
<span>
${station.altitude ?? 'n/d'} m
</span>

<span>
${
station.summary.online
? 'ONLINE'
: 'OFFLINE'
}
</span>

<span>
${
Number.isFinite(
station.summary.rainValue
)
? `${Math.round(station.summary.rainValue)} mm`
: 'n/d'
}
</span>
</div>
`;

button.onclick = () => {
els.stationSelect.value =
station.id;

focusStation(station);
};

els.stationList.appendChild(button);
});
}

function focusStation(station) {
const marker =
markerRefs.get(station.id);

if (!marker) return;

map.flyTo(
[station.lat,station.lon],
11,
{
duration:.8
}
);

marker.openPopup();
}

function selectedStationData() {
const id =
els.stationSelect.value;

if (!id) {
return stationData;
}

return stationData.filter(
station =>
station.id === id
);
}

function updateView() {
const selected =
selectedStationData();

refreshMarkers(selected);
renderStationList(selected);

if (
els.stationSelect.value &&
selected.length === 1
) {
focusStation(selected[0]);
}
}

function renderSummary() {
const offline =
stationData.filter(
station =>
station.summary.count > 0 &&
!station.summary.online
).length;

els.summaryLine.innerHTML =
`Stazioni Monitorate <strong>${stationData.length}</strong> ` +
`di cui <strong>${offline}</strong> Offline`;
}

function quadIndexOf(lat,lon) {
if (
!Number.isFinite(lat) ||
!Number.isFinite(lon)
) {
return null;
}

const row =
lat >= 42.20
? 0
: 1;

const col =
lon < 13.60
? 0
: lon < 14.20
? 1
: 2;

return row * 3 + col;
}

function applyViewport(quad) {
map.fitBounds(
quad === null
? totalBounds
: zoneBounds[quad],
{
padding:[20,20],
maxZoom:12
}
);
}

function setWeatherMode(mode) {
labelMode = mode;

const labels = {
rain:{
text:'Piogge Giornaliere',
className:'weather-mode-label'
},

min:{
text:'Temperature Minime Giornaliere',
className:'weather-mode-label min'
},

max:{
text:'Temperature Massime Giornaliere',
className:'weather-mode-label max'
}
};

const selected =
labels[mode] || labels.rain;

els.weatherModeLabel.textContent =
selected.text;

els.weatherModeLabel.className =
selected.className;

els.labelRainBtn.classList.toggle(
'active',
mode === 'rain'
);

els.labelMinBtn.classList.toggle(
'active',
mode === 'min'
);

els.labelMaxBtn.classList.toggle(
'active',
mode === 'max'
);

updateView();
}

function toggleSidebar() {
APP.classList.toggle(
'sidebar-collapsed'
);

const collapsed =
APP.classList.contains(
'sidebar-collapsed'
);

els.sidebarToggleInside.style.display =
collapsed
? 'none'
: 'block';

els.sidebarToggleMini.style.display =
collapsed
? 'block'
: 'none';

setTimeout(
() => map.invalidateSize(),
260
);
}

async function init() {
try {
const [
stationText,
weatherText
] = await Promise.all([
fetchText(STATIONS_CSV),
fetchText(WEATHER_CSV)
]);

const stationParsed =
Papa.parse(
stationText,
{
header:true,
skipEmptyLines:true,
delimiter:
delimiter(stationText),
transformHeader:
header => header.trim(),
transform:
value => String(value).trim()
}
);

const weatherParsed =
Papa.parse(
weatherText,
{
header:true,
skipEmptyLines:true,
delimiter:
delimiter(weatherText),
transformHeader:
header => header.trim(),
transform:
value => String(value).trim()
}
);

const stationRows =
stationParsed.data || [];

const weatherRows =
weatherParsed.data || [];

const weatherById =
new Map();

weatherRows.forEach(row => {
const id =
get(row,'Id','id');

if (!id) return;

if (!weatherById.has(id)) {
weatherById.set(id,[]);
}

weatherById.get(id).push(row);
});

stationData =
stationRows
.map(row => {
const id =
get(row,'Id','id');

const name =
get(
row,
'Stazione Meteo',
'StazioneMeteo',
'stazionemeteo',
'stazione'
);

const lat =
num(
get(row,'Lat','lat')
);

const lon =
num(
get(
row,
'Long',
'long',
'Lon',
'lon'
)
);

return {
id,
name,
lat,
lon,

altitude:
num(
get(
row,
'Altitudine',
'altitudine'
)
),

reference:
get(
row,
'Riferimento',
'riferimento'
),

summary:
summarizeWeather(
weatherById.get(id) || []
),

quad:
quadIndexOf(lat,lon)
};
})
.filter(station =>
station.id &&
station.name &&
Number.isFinite(station.lat) &&
Number.isFinite(station.lon)
);

const latestGlobal =
stationData
.map(station =>
station.summary.latest?.stationUpdatedAt ||
station.summary.latest?.updatedAt ||
station.summary.latest?.detectedAt
)
.filter(Boolean)
.sort((a,b) => a-b)
.at(-1);

els.lastUpdate.textContent =
formatDate(latestGlobal);

renderStationSelect();
renderSummary();
updateView();

els.debugBox.textContent =
`stationData=${stationData.length}\n` +
`offline=${
stationData.filter(
station =>
!station.summary.online
).length
}`;

} catch (error) {
els.debugBox.textContent =
String(error?.stack || error);
}
}

els.stationSelect.addEventListener(
'change',
updateView
);

els.resetViewBtn.addEventListener(
'click',
() => applyViewport(null)
);

els.labelRainBtn.addEventListener(
'click',
() => setWeatherMode('rain')
);

els.labelMinBtn.addEventListener(
'click',
() => setWeatherMode('min')
);

els.labelMaxBtn.addEventListener(
'click',
() => setWeatherMode('max')
);

els.quadGrid.addEventListener(
'click',
event => {
const button =
event.target.closest('[data-quad]');

if (!button) return;

applyViewport(
Number(button.dataset.quad)
);
}
);

els.sidebarToggleInside.addEventListener(
'click',
toggleSidebar
);

els.sidebarToggleMini.addEventListener(
'click',
toggleSidebar
);

setWeatherMode('rain');
init();
})();
</script>
</body>
</html>
