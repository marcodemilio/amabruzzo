<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alcolisti Meteo Analcolici - Rel. 01-B-005</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    :root{
      --bg:#f7f6f2;
      --surface:#fff;
      --surface2:#fff;
      --border:#d4d1ca;
      --text:#28251d;
      --muted:#6f6d68;
      --primary:#01696f;
      --success:#437a22;
      --danger:#a13544;
      --temp:#d95f02;
      --rain:#1f78b4;
      --shadow:0 6px 18px rgba(0,0,0,.12);
      --radius:1rem;
      --font:'Inter',system-ui,sans-serif;
      --sidebar-width:360px;
      --blue-dark:#003f88;
      --blue:#1f78b4;
      --gray:#9a9a9a;
      --red:#a13544;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
    .app{display:grid;grid-template-columns:var(--sidebar-width) 1fr;min-height:100vh;transition:grid-template-columns .25s ease}
    .app.sidebar-collapsed{grid-template-columns:0 1fr}
    .sidebar{
      background:var(--surface);
      border-right:1px solid var(--border);
      padding:1rem;
      display:flex;
      flex-direction:column;
      gap:1rem;
      overflow:auto;
      width:var(--sidebar-width);
      transition:transform .25s ease, opacity .25s ease, padding .25s ease;
    }
    .app.sidebar-collapsed .sidebar{
      transform:translateX(-100%);
      opacity:0;
      pointer-events:none;
      padding:0;
      border-right:none;
    }
    .brand{display:flex;justify-content:center;align-items:flex-start;gap:.75rem;text-align:center}
    .logo-wrap{display:flex;gap:.65rem;align-items:center;justify-content:center;width:100%}
    .logo{width:40px;height:40px;color:var(--primary)}
    h1{margin:0;font-size:clamp(.98rem,1.35vw,1.25rem);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
    .subtitle-small{margin:.35rem 0 0;color:var(--muted);font-size:.78rem;line-height:1.25;text-align:center}
    .subtitle-small strong{color:#b00020;font-weight:800}
    .release{font-size:.72rem;color:var(--muted);display:block;margin-top:.15rem;text-align:center}
    .panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .panel h2{margin:0 0 .6rem;font-size:1.05rem}
    .field label{display:block;font-size:.92rem;font-weight:600;margin-bottom:.3rem}
    .field input{width:100%;min-height:42px;border-radius:.5rem;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:0 .75rem}
    .list{display:grid;gap:.7rem;max-height:32vh;overflow:auto;padding-right:.25rem}
    .station-card{border:1px solid var(--border);border-radius:.75rem;background:var(--bg);padding:.85rem;cursor:pointer;text-align:left;color:inherit}
    .station-title{font-weight:700;margin-bottom:.2rem}
    .station-meta{font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.45rem}
    .map-wrap{position:relative}
    .map-wrap,#map{height:100vh;width:100%}
    .popup-title{font-weight:800;margin-bottom:.35rem;color:var(--primary);font-size:1rem}
    .popup-meta{font-size:.92rem;color:var(--text);line-height:1.4}
    .popup-line{margin-top:.25rem}
    .popup-day{font-family:inherit}
    .station-marker{
      min-width:34px;height:34px;border-radius:999px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.25);
      display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;line-height:1;
      position:relative;transform:translate(-50%,-50%);padding:0 .25rem
    }
    .station-marker.online{background:var(--success)}
    .station-marker.offline{background:var(--danger)}
    .station-marker.min.online{background:var(--blue-dark)}
    .station-marker.min.offline{background:var(--red)}
    .station-marker.max.online{background:var(--red)}
    .station-marker.max.offline{background:var(--gray)}
    .station-marker.rain.online{background:var(--success)}
    .station-marker.rain.offline{background:var(--danger)}
    .station-marker::after{
      content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
      width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid currentColor
    }
    .station-marker.online::after{color:var(--success)}
    .station-marker.offline::after{color:var(--danger)}
    .map-toggle{position:absolute;top:1rem;right:1rem;z-index:1000}
    .map-toggle-group{position:absolute;top:4rem;right:1rem;z-index:1000}
    .map-toggle-second{min-width:132px}
    .quad-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem;margin-top:.65rem}
    .quad-grid .toolbar-btn{min-height:36px;padding:0 .55rem;font-size:.82rem}
    .quad-total{margin-top:.5rem;font-size:.85rem;color:var(--muted);text-align:center}
    .icon-row{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.5rem;justify-content:center}
    .icon-pill{
      display:inline-flex;align-items:center;justify-content:center;min-height:38px;min-width:68px;padding:0 .8rem;border-radius:999px;border:1px solid var(--border);
      background:var(--bg);color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer;user-select:none
    }
    .icon-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .weather-icon{font-size:1.45rem;line-height:1}
    .blue-dark{color:var(--blue-dark)}
    .red{color:var(--red)}
    .blue{color:var(--blue)}
    .debug-box{white-space:pre-wrap;font-size:.82rem;line-height:1.35;max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:.75rem;padding:.75rem}
    @media (max-width:980px){
      .app{grid-template-columns:1fr}
      .sidebar{border-right:none;border-bottom:1px solid var(--border);width:auto}
      .app.sidebar-collapsed{grid-template-columns:1fr}
      .app.sidebar-collapsed .sidebar{transform:none;opacity:1;pointer-events:auto;padding:1rem;border-bottom:1px solid var(--border)}
      .map-wrap,#map{height:70vh}
      h1{font-size:clamp(.98rem,4vw,1.2rem)}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-wrap">
          <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 39C18 25 25 18 33 12C40 21 46 31 54 39C49 45 43 50 33 54C23 49 16 45 10 39Z" stroke="currentColor" stroke-width="3"/>
            <path d="M24 39C24 34 27 31 32 31C37 31 40 34 40 39" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M22 44H42" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M32 18V27" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <div>
            <h1>Alcolisti Meteo Analcolici</h1>
            <span class="release">Rel. 01-B-005</span>
            <p class="subtitle-small" id="subtitleText">dati aggiornati al <strong id="lastUpdate">07/08/2026, 17:45:45</strong></p>
            <div class="icon-row">
              <button class="icon-pill active" id="labelRainBtn" type="button"><span class="weather-icon">☔</span></button>
              <button class="icon-pill" id="labelMinBtn" type="button"><span class="weather-icon blue-dark">🌡</span></button>
              <button class="icon-pill" id="labelMaxBtn" type="button"><span class="weather-icon red">🌡</span></button>
            </div>
          </div>
        </div>
      </div>

      <section class="panel">
        <h2>Filtri</h2>
        <div class="field">
          <label for="searchInput">Cerca stazione</label>
          <input id="searchInput" type="search" placeholder="Es. Prati Di Tivo" />
        </div>
        <p id="loadStatus" class="subtitle" style="margin-top:.75rem">Caricamento dati in corso…</p>
        <div id="filterSummary" class="subtitle-small" style="margin-top:.6rem"></div>
      </section>

      <section class="panel">
        <h2>Quadranti Abruzzo</h2>
        <div class="quad-grid" id="quadGrid">
          <button class="toolbar-btn" data-quad="0" type="button">Q1</button>
          <button class="toolbar-btn" data-quad="1" type="button">Q2</button>
          <button class="toolbar-btn" data-quad="2" type="button">Q3</button>
          <button class="toolbar-btn" data-quad="3" type="button">Q4</button>
          <button class="toolbar-btn" data-quad="4" type="button">Q5</button>
          <button class="toolbar-btn" data-quad="5" type="button">Q6</button>
        </div>
        <button id="resetViewBtn" class="toolbar-btn" type="button" style="width:100%;margin-top:.6rem">Totale</button>
        <div id="quadTotal" class="quad-total"></div>
      </section>

      <section class="panel">
        <h2>Debug</h2>
        <div id="debugBox" class="debug-box">In attesa del caricamento…</div>
      </section>

      <section class="panel">
        <h2>Stazioni</h2>
        <div id="stationList" class="list"></div>
      </section>
    </aside>

    <main class="map-wrap">
      <button id="sidebarToggle" class="toolbar-btn map-toggle" type="button">Nascondi</button>
      <div class="map-toggle-group">
        <button id="fitBtnSidebar" class="toolbar-btn map-toggle-second" type="button">Centra Abruzzo</button>
      </div>
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
  (() => {
    const STATIONS_CSV = './stazioni_meteo.csv';
    const WEATHER_CSV = './dati_meteo_30g.csv';
    const APP = document.getElementById('app');
    const map = L.map('map').setView([42.2, 13.75], 8.4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);
    const abruzzoBounds = [L.latLngBounds([[41.80, 13.00], [42.20, 13.60]]),L.latLngBounds([[41.80, 13.60], [42.20, 14.20]]),L.latLngBounds([[41.80, 14.20], [42.20, 14.90]]),L.latLngBounds([[42.20, 13.00], [42.60, 13.60]]),L.latLngBounds([[42.20, 13.60], [42.60, 14.20]]),L.latLngBounds([[42.20, 14.20], [42.60, 14.90]])];
    const totalBounds = L.latLngBounds([[41.65, 13.0], [42.95, 14.95]]);
    map.setMaxBounds(L.latLngBounds([[41.55, 12.75], [42.95, 15.05]]));
    map.fitBounds(totalBounds, { padding: [20, 20], maxZoom: 10 });

    const els = {searchInput: document.getElementById('searchInput'),stationList: document.getElementById('stationList'),loadStatus: document.getElementById('loadStatus'),fitBtnSidebar: document.getElementById('fitBtnSidebar'),debugBox: document.getElementById('debugBox'),quadGrid: document.getElementById('quadGrid'),labelRainBtn: document.getElementById('labelRainBtn'),labelMinBtn: document.getElementById('labelMinBtn'),labelMaxBtn: document.getElementById('labelMaxBtn'),subtitleText: document.getElementById('subtitleText'),sidebarToggle: document.getElementById('sidebarToggle'),filterSummary: document.getElementById('filterSummary'),resetViewBtn: document.getElementById('resetViewBtn'),quadTotal: document.getElementById('quadTotal')};
    let stationData = [];
    let markersLayer = L.layerGroup().addTo(map);
    let markerRefs = new Map();
    let labelMode = 'rain';
    let currentQuad = null;
    const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’']/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
    const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.').trim()); return Number.isFinite(n) ? n : null; };
    const flexDate = raw => { const d = String(raw || '').replace(/\D/g, ''); if (d.length < 8) return null; const iso = `${d.slice(4,8)}-${d.slice(2,4)}-${d.slice(0,2)}T${d.length >= 10 ? d.slice(8,10) : '00'}:${d.length >= 12 ? d.slice(10,12) : '00'}:${d.length >= 14 ? d.slice(12,14) : '00'}`; const x = new Date(iso); return Number.isNaN(x.getTime()) ? null : x; };
    const fetchText = async p => { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error(`HTTP ${r.status} per ${p}`); return await r.text(); };
    const delimiter = t => [';', ',', '\t', '|'].map(c => ({ c, n: (t.split(/\r?\n/).slice(0, 10).join('\n').match(new RegExp('\\' + c, 'g')) || []).length })).sort((a,b)=>b.n-a.n)[0].c;
    const get = (r, ...keys) => { for (const k of keys) { const v = r[k]; if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim(); } return ''; };

    const parseWeather = rows => rows.map(r => ({date: flexDate(get(r, 'DataRilevamento', 'DataAggiornamento', 'Data')),tmax: num(get(r, 'TemperaturaMax', 'TemperaturaMassima')),tmin: num(get(r, 'TemperaturaMin', 'TemperaturaMinima')),rain: num(get(r, 'PioggiaGiornaliera', 'Pioggia Giornaliera')),stato: String(get(r, 'Stato', 'stato')).trim().toLowerCase(),fonte: String(get(r, 'FonteDati', 'fontedati')).trim().toLowerCase()})).filter(r => r.date).sort((a, b) => a.date - b.date);
    const summarizeWeather = rows => { const cleaned = parseWeather(rows); const latest = cleaned.at(-1) || null; const online = (latest?.fonte === 'online') || latest?.stato === 'online' || latest?.stato === '1' || latest?.stato === 'true'; return { count: cleaned.length, latest, rainValue: latest ? latest.rain : null, online, series: cleaned }; };
    const weatherExtremes = () => { const valid = stationData.filter(s => s.summary.count > 0); const rainMax = [...valid].sort((a, b) => (b.summary.rainValue ?? -1) - (a.summary.rainValue ?? -1))[0] || null; const tmaxMax = [...valid].sort((a, b) => (b.summary.latest?.tmax ?? -999) - (a.summary.latest?.tmax ?? -999))[0] || null; const tminMin = [...valid].sort((a, b) => (a.summary.latest?.tmin ?? 999) - (b.summary.latest?.tmin ?? 999))[0] || null; const offlineCount = stationData.filter(s => s.summary.count > 0 && !s.summary.online).length; return { rainMax, tmaxMax, tminMin, offlineCount }; };
    const getLabelValue = s => { const latest = s.summary.latest || {}; if (labelMode === 'min') return Number.isFinite(latest.tmin) ? Math.round(latest.tmin) : '–'; if (labelMode === 'max') return Number.isFinite(latest.tmax) ? Math.round(latest.tmax) : '–'; return Number.isFinite(s.summary.rainValue) ? Math.round(s.summary.rainValue) : '–'; };
    const popupHtml = s => {
      const statusLabel = s.summary.online ? 'Online' : 'Offline';
      const statusTime = s.summary.latest?.date ? s.summary.latest.date.toLocaleString('it-IT') : 'n/d';
      const latest = s.summary.latest || {};
      const byDay = new Map();
      s.summary.series.forEach(r => {
        if (!r.date) return;
        const key = r.date.toLocaleDateString('it-IT');
        const prev = byDay.get(key) || { rain: 0, tmin: null, tmax: null };
        prev.rain += Number.isFinite(r.rain) ? r.rain : 0;
        if (Number.isFinite(r.tmin)) prev.tmin = prev.tmin === null ? r.tmin : Math.min(prev.tmin, r.tmin);
        if (Number.isFinite(r.tmax)) prev.tmax = prev.tmax === null ? r.tmax : Math.max(prev.tmax, r.tmax);
        byDay.set(key, prev);
      });
      const today = new Date(); today.setHours(0,0,0,0);
      const fmtDay = d => d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
      const rows = []; let runningTotal = 0;
      for (let i = 1; i <= 30; i++) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        const key = d.toLocaleDateString('it-IT');
        const item = byDay.get(key);
        const rain = item ? item.rain : 0;
        runningTotal += rain;
        const tempTxt = (item && Number.isFinite(item.tmin) && Number.isFinite(item.tmax))
          ? `<span style="color:var(--blue-dark)">[${item.tmin.toFixed(0)}° - <span style="color:var(--red)">${item.tmax.toFixed(0)}°</span>]</span>`
          : '<span style="color:var(--muted)">[n/d]</span>';
        rows.push(`<div class="popup-day">- ${fmtDay(d)} · <span style="color:var(--rain)">${rain.toFixed(1)} mm</span> (${runningTotal.toFixed(1)}) ${tempTxt}</div>`);
      }
      return `<div class="popup-title">${s.name}</div><div class="popup-meta"><div class="popup-line"><strong style="color:var(--success)">${statusLabel}</strong> · ${statusTime}</div><div class="popup-line">Oggi · <span style="color:var(--rain)">${Number.isFinite(s.summary.rainValue) ? s.summary.rainValue.toFixed(1) : 'n/d'} mm</span> · ${Number.isFinite(latest.tmin) && Number.isFinite(latest.tmax) ? `<span style="color:var(--blue)"> ${latest.tmin.toFixed(0)}°</span> - <span style="color:var(--red)">${latest.tmax.toFixed(0)}°</span>` : 'n/d'}</div><div style="margin-top:.5rem;max-height:260px;overflow:auto;padding-right:.25rem">${rows.join('')}</div></div>`;
    };
    const markerIcon = s => { const modeClass = labelMode === 'min' ? 'min' : labelMode === 'max' ? 'max' : 'rain'; const statusClass = s.summary.online ? 'online' : 'offline'; return L.divIcon({ className: '', html: `<div class="station-marker ${modeClass} ${statusClass}">${getLabelValue(s)}</div>`, iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -70] }); };
    const refreshMarkers = data => { markersLayer.clearLayers(); markerRefs.clear(); data.forEach(s => { const m = L.marker([s.lat, s.lon], { icon: markerIcon(s) }).addTo(markersLayer).bindPopup(popupHtml(s), { autoPan: true, offset: L.point(0, 70), maxHeight: 320 }); markerRefs.set(s.id, m); }); };
    function renderTopSummary() { const ex = weatherExtremes(); const activeName = labelMode === 'rain' ? ex.rainMax?.name : labelMode === 'min' ? ex.tminMin?.name : ex.tmaxMax?.name; const activeVal = labelMode === 'rain' ? ex.rainMax?.summary.rainValue : labelMode === 'min' ? ex.tminMin?.summary.latest?.tmin : ex.tmaxMax?.summary.latest?.tmax; const activeText = labelMode === 'rain' ? `Pioggia ☔ ${Number.isFinite(activeVal) ? Math.round(activeVal) : 'n/d'} mm - ${activeName || 'n/d'}` : labelMode === 'min' ? `Temperatura minima 🌡 ${Number.isFinite(activeVal) ? Math.round(activeVal) : 'n/d'}° - ${activeName || 'n/d'}` : `Temperatura Massima 🌡 ${Number.isFinite(activeVal) ? Math.round(activeVal) : 'n/d'}° - ${activeName || 'n/d'}`; els.filterSummary.innerHTML = `Stazioni Monitorate <strong>${stationData.length}</strong> di cui <strong>${weatherExtremes().offlineCount}</strong> Offline<br>${activeText}`; }
    function updateQuadTotal() { const count = currentQuad === null ? stationData.length : stationData.filter(s => s.quad === currentQuad).length; els.quadTotal.textContent = currentQuad === null ? `Totale: ${count}` : `Totale quadrante: ${count}`; }
    function quadIndexOf(lat, lon) { if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null; const row = lat < 42.2 ? 0 : 1; const col = lon < 13.6 ? 0 : lon < 14.2 ? 1 : 2; return row * 3 + col; }
    function applyViewport(quad) { currentQuad = quad; if (quad === null) map.fitBounds(totalBounds, { padding: [20, 20], maxZoom: 10 }); else map.fitBounds(abruzzoBounds[quad], { padding: [20, 20], maxZoom: 12 }); updateQuadTotal(); }
    function setDebug(stationsRows, weatherRows, parsedStations, parsedWeather, weatherById, stTxt, weTxt) { const s0 = stationsRows[0] || {}; const w0 = weatherRows[0] || {}; els.debugBox.textContent = `URL stazioni: ${STATIONS_CSV}\nURL meteo: ${WEATHER_CSV}\n\nStazioni raw\nrighe: ${stationsRows.length}\ndelimitatore: ${parsedStations.meta?.delimiter || ','}\ncolonne: ${Object.keys(s0).join(', ') || 'n/d'}\n\nMeteo raw\nrighe: ${weatherRows.length}\ndelimitatore: ${parsedWeather.meta?.delimiter || ','}\ncolonne: ${Object.keys(w0).join(', ') || 'n/d'}\n\nMatch\nstazioni totali: ${stationData.length}\ncon dati meteo: ${stationData.filter(s => s.summary.count > 0).length}\nsenza dati meteo: ${stationData.filter(s => s.summary.count === 0).length}\nid meteo: ${weatherById.size}\n\nAnteprima stazioni\n${stTxt.slice(0, 400)}\n\nAnteprima meteo\n${weTxt.slice(0, 400)}\n`; }
    function renderStationList(data) { els.stationList.innerHTML = ''; data.forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.className = 'station-card'; b.dataset.id = s.id; b.innerHTML = `<div class="station-title">${s.name}</div><div class="station-meta"><span>${s.altitude ?? 'n/d'} m</span><span>${s.summary.online ? 'online' : 'offline'}</span><span>${Number.isFinite(s.summary.rainValue) ? `${Math.round(s.summary.rainValue)} mm` : 'n/d'}</span></div>`; b.onclick = () => { const m = markerRefs.get(s.id); if (m) { map.flyTo([s.lat, s.lon], 11, { duration: .8 }); m.openPopup(); } }; els.stationList.appendChild(b); }); }
    function filterStations() { const q = normName(els.searchInput.value); const filtered = stationData.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lon) && (!q || normName(s.name).includes(q) || normName(s.reference).includes(q))); refreshMarkers(filtered); renderStationList(filtered); updateQuadTotal(); }
    async function init() { try { const [stTxt, weTxt] = await Promise.all([fetchText(STATIONS_CSV), fetchText(WEATHER_CSV)]); const parsedStations = Papa.parse(stTxt, { header: true, skipEmptyLines: true, delimiter: delimiter(stTxt), transformHeader: h => h.trim(), transform: v => String(v).trim() }); const parsedWeather = Papa.parse(weTxt, { header: true, skipEmptyLines: true, delimiter: delimiter(weTxt), transformHeader: h => h.trim(), transform: v => String(v).trim() }); const stationsRows = parsedStations.data || []; const weatherRows = parsedWeather.data || []; const weatherById = new Map(); weatherRows.forEach(r => { const id = get(r, 'Id', 'id'); if (!id) return; if (!weatherById.has(id)) weatherById.set(id, []); weatherById.get(id).push(r); }); stationData = stationsRows.map(r => { const id = get(r, 'Id', 'id'); const name = get(r, 'Stazione Meteo', 'StazioneMeteo', 'stazionemeteo', 'stazione'); const weather = weatherById.get(id) || []; return { id, name, lat: num(get(r, 'Lat', 'lat')), lon: num(get(r, 'Long', 'long', 'Lon', 'lon')), altitude: num(get(r, 'Altitudine', 'altitudine')), reference: get(r, 'Riferimento', 'riferimento'), summary: summarizeWeather(weather), quad: quadIndexOf(num(get(r, 'Lat', 'lat')), num(get(r, 'Long', 'long', 'Lon', 'lon'))) }; }).filter(s => s.id && s.name && Number.isFinite(s.lat) && Number.isFinite(s.lon)); const latestAgg = weatherRows.map(r => flexDate(get(r, 'DataAggiornamento', 'DataRilevamento', 'Data'))).filter(Boolean).sort((a, b) => a - b).at(-1); els.subtitleText.innerHTML = `dati aggiornati al <strong id="lastUpdate">${latestAgg ? latestAgg.toLocaleString('it-IT') : 'n/d'}</strong>`; renderTopSummary(); refreshMarkers(stationData); renderStationList(stationData); setDebug(stationsRows, weatherRows, parsedStations, parsedWeather, weatherById, stTxt, weTxt); updateQuadTotal(); } catch (err) { els.debugBox.textContent = String(err?.stack || err?.message || err); } }
    els.searchInput.addEventListener('input', filterStations);
    els.fitBtnSidebar.addEventListener('click', () => { currentQuad = null; applyViewport(null); });
    els.resetViewBtn.addEventListener('click', () => { currentQuad = null; applyViewport(null); });
    els.labelRainBtn.addEventListener('click', () => { labelMode = 'rain'; els.labelRainBtn.classList.add('active'); els.labelMinBtn.classList.remove('active'); els.labelMaxBtn.classList.remove('active'); renderTopSummary(); refreshMarkers(stationData); filterStations(); });
    els.labelMinBtn.addEventListener('click', () => { labelMode = 'min'; els.labelMinBtn.classList.add('active'); els.labelRainBtn.classList.remove('active'); els.labelMaxBtn.classList.remove('active'); renderTopSummary(); refreshMarkers(stationData); filterStations(); });
    els.labelMaxBtn.addEventListener('click', () => { labelMode = 'max'; els.labelMaxBtn.classList.add('active'); els.labelRainBtn.classList.remove('active'); els.labelMinBtn.classList.remove('active'); renderTopSummary(); refreshMarkers(stationData); filterStations(); });
    els.quadGrid.addEventListener('click', e => { const btn = e.target.closest('[data-quad]'); if (!btn) return; const idx = Number(btn.dataset.quad); applyViewport(idx); });
    els.sidebarToggle.addEventListener('click', () => { APP.classList.toggle('sidebar-collapsed'); els.sidebarToggle.textContent = APP.classList.contains('sidebar-collapsed') ? 'Mostra' : 'Nascondi'; setTimeout(() => map.invalidateSize(), 260); });
    document.documentElement.setAttribute('data-theme', 'light');
    init();
  })();
  </script>
</body>
